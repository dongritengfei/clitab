[package]
name = "clitab"
version = "0.1.0"
description = "A terminal tab manager with Claude Code integration"
authors = ["you"]
edition = "2021"

[lib]
name = "clitab_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
