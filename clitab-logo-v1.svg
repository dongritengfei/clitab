<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="clitab logo - dark gradient terminal with tabs">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2233"/>
      <stop offset="1" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="acc1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="clip1"><rect x="0" y="0" width="1024" height="1024" rx="200"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bg1)"/>

  <g clip-path="url(#clip1)">
    <!-- tab strip -->
    <rect x="120" y="150" width="784" height="122" rx="34" fill="#141a29"/>
    <rect x="145" y="172" width="230" height="98" rx="22" fill="url(#acc1)"/>
    <rect x="392" y="172" width="230" height="98" rx="22" fill="#242d42"/>
    <rect x="639" y="172" width="230" height="98" rx="22" fill="#242d42"/>

    <!-- window body -->
    <rect x="120" y="300" width="784" height="574" rx="34" fill="#0e1422"/>

    <!-- prompt chevron -->
    <path d="M232 468 L356 570 L232 672" fill="none" stroke="url(#acc1)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- cursor line -->
    <rect x="430" y="640" width="230" height="46" rx="23" fill="url(#acc1)"/>
  </g>
</svg>
