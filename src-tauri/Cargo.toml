[package]
name = "clitab"
version = "0.3.0"
description = "A terminal tab manager with Claude Code integration"
authors = ["you"]
edition = "2021"

[lib]
name = "clitab_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPasteboard", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSError", "NSString", "NSObject", "NSURL"] }
objc2-user-notifications = { version = "0.3", features = [
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
    "block2",
] }
block2 = "0.6"

